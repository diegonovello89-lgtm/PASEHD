<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pase HD">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pase HD</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#0f1b24;--mu:#5b6b78;--ac:#0f766e;--onac:#fff;--ac2:#d5f5ef;--bd:#dce3e8;--wa:#b45309;--wabg:#fef3c7;--ok:#15803d;--okbg:#dcfce7;--dn:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0b1218;--card:#141f28;--tx:#e8eef2;--mu:#8fa1ae;--ac:#2dd4bf;--onac:#06201e;--ac2:#0f3b38;--bd:#25343f;--wa:#fbbf24;--wabg:#3a2e0b;--ok:#4ade80;--okbg:#0f3320;--dn:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
#app{max-width:640px;margin:0 auto;padding:0 12px calc(150px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.datebar .d{flex:1;text-align:center;font-weight:700;font-size:18px;text-transform:capitalize}
.datebar .d small{display:block;font-weight:500;color:var(--mu);font-size:13px;text-transform:none}
.ib{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:20px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{position:relative;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-weight:700}
.tab.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.tab i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;font-style:normal;font-size:12px;line-height:20px;padding:0 5px;font-weight:700}
.tab i.w{background:var(--wa);color:#fff}.tab i.k{background:var(--ok);color:#fff}
.card{display:grid;grid-template-columns:54px 1fr 64px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:10px}
.sil{text-align:center;background:var(--ac2);border-radius:10px;padding:6px 0}.sil small{display:block;font-size:10px;color:var(--mu)}.sil b{font-size:22px}
.nm{font-weight:700;overflow-wrap:anywhere}.ex{color:var(--mu);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;background:var(--ac2);border-radius:8px;padding:2px 7px}.chip.w{background:var(--wabg);color:var(--wa);font-weight:600}
.cm{margin-top:4px;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.nota{height:56px;border-radius:12px;border:2px solid var(--wa);background:var(--wabg);color:var(--wa);font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.nota small{font-size:11px;font-weight:600}.nota.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.sum{font-size:13px;color:var(--mu);margin:2px 2px 0}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom));height:54px;padding:0 20px;border-radius:27px;background:var(--ac);color:var(--onac);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:62px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button span{font-size:22px}nav button.on{color:var(--ac);font-weight:700}
nav button em{position:absolute;top:6px;left:calc(50% + 6px);background:var(--wa);color:#fff;font-style:normal;font-size:11px;border-radius:9px;min-width:18px;padding:0 5px;line-height:18px}
#ov{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh-head>button,.btn,.pri{background:var(--ac);color:var(--onac);border-radius:12px;padding:12px 16px;font-weight:700;display:inline-block;text-align:center}
.pri{width:100%;margin-top:12px;font-size:17px}
.dng{width:100%;margin-top:20px;border:1px solid var(--dn);color:var(--dn);border-radius:12px;padding:12px;font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input:not([type]),input[type=search],select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px}
.nm-in{font-weight:700;font-size:18px!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--wa);margin-top:8px}
#a-sug button{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:6px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
#a-sug small{color:var(--mu)}
h4{margin:18px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.notabig{width:100%;margin-top:10px;padding:14px;border-radius:12px;font-weight:800;font-size:17px;border:2px solid var(--wa);background:var(--wabg);color:var(--wa)}
.notabig.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th{width:96px}.th img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}.th small{display:block;font-size:11px;color:var(--mu);text-align:center}
.pr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:6px}
.pr span{flex:1;overflow-wrap:anywhere}.pr.dn span{text-decoration:line-through;color:var(--mu)}
.ck{width:32px;height:32px;border-radius:8px;border:2px solid var(--ac);font-weight:800;color:var(--onac);flex:none}.ck.on{background:var(--ac)}
.x{font-size:22px;color:var(--mu);width:32px;height:32px}
.addrow{display:flex;gap:8px;margin-top:8px}.addrow button{width:52px;border-radius:12px;background:var(--ac);color:var(--onac);font-size:26px;font-weight:700}
.mu{color:var(--mu);font-size:14px}
details{margin-top:12px}summary{padding:6px 0;color:var(--mu);font-weight:600}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.box h3{margin:0 0 6px;font-size:16px}.box p{margin:6px 0;font-size:14px;color:var(--mu)}
.box .btn{margin-top:8px}.box .sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.banner{background:var(--wabg);color:var(--wa);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner button{margin-left:auto;font-size:20px;color:inherit}
.pg{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.pg .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;display:none;max-width:90%}
#vw{display:none;position:fixed;inset:0;background:#000;z-index:30;flex-direction:column}
#vw.on{display:flex}
#vw .bar{display:flex;gap:8px;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
#vw .bar button{background:#fff2;color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
#vw .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#vw img{width:100%;display:block}#vw.z img{width:320%;max-width:none}
</style>
</head>
<body>
<div id="app"><div id="main"></div></div>
<button class="fab" id="fab">＋ Paciente</button>
<nav>
  <button data-v="hoy"><span>🩺</span>Pase</button>
  <button data-v="pend"><span>⏳</span>Pendientes</button>
  <button data-v="resp"><span>💾</span>Respaldo</button>
</nav>
<div id="ov"></div>
<div id="vw"><div class="bar"><button id="v-zoom">🔍 Zoom</button><button id="v-del">🗑 Borrar</button><button id="v-x">Cerrar</button></div><div class="sc"><img id="v-img" alt="Hoja de signos"></div></div>
<div id="toast"></div>

<script>
'use strict';
const TURNOS=[1,2,3,4,5];
const DIAS_FOTO=7;
const DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const todayStr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const fmtFecha=s=>new Date(s+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const normExp=s=>String(s||'').trim().toUpperCase();
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('pase-hd',1);
  r.onupgradeneeded=()=>{const d=r.result;
    d.createObjectStore('patients',{keyPath:'expediente'});
    const e=d.createObjectStore('entries',{keyPath:'id'});e.createIndex('fecha','fecha');
    d.createObjectStore('photos',{keyPath:'id'});
    d.createObjectStore('meta',{keyPath:'k'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const rq=req=>new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const get=(n,k)=>rq(store(n).get(k));
const put=(n,v)=>rq(store(n,'readwrite').put(v));
const del=(n,k)=>rq(store(n,'readwrite').delete(k));
const all=n=>rq(store(n).getAll());
const byDate=f=>rq(store('entries').index('fecha').getAll(f));

/* ---------- Estado ---------- */
const S={fecha:todayStr(),turno:1,view:'hoy',hoy:true};
{const t=+lsGet('turno');if(t>=1&&t<=5)S.turno=t}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const sillonNum=e=>{const n=parseInt(e.sillon,10);return isNaN(n)?9999:n};
const cmpSillon=(a,b)=>sillonNum(a)-sillonNum(b)||(a.creado||0)-(b.creado||0);

/* ---------- Render principal ---------- */
async function render(){
  if(!db)return;
  if(S.view==='hoy')await renderHoy();else if(S.view==='pend')await renderPend();else await renderResp();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('#fab').style.display=S.view==='hoy'?'block':'none';
  try{
    const pats=await all('patients');const n=pats.reduce((s,p)=>s+p.pendientes.filter(x=>!x.hecho).length,0);
    const b=$('nav button[data-v=pend]');let em=$('em',b);
    if(n){if(!em){em=document.createElement('em');b.appendChild(em)}em.textContent=n}else if(em)em.remove();
  }catch(e){}
}

async function renderHoy(){
  const [ents,pats]=await Promise.all([byDate(S.fecha),all('patients')]);
  const P=Object.fromEntries(pats.map(x=>[x.expediente,x]));
  const pend=ents.filter(e=>!e.nota).length;
  const tabs=TURNOS.map(t=>{const es=ents.filter(e=>e.turno===t);const np=es.filter(e=>!e.nota).length;
    return `<button class="tab ${t===S.turno?'on':''}" data-t="${t}">T${t}${es.length?`<i class="${np?'w':'k'}">${np||'✓'}</i>`:''}</button>`}).join('');
  const list=ents.filter(e=>e.turno===S.turno).sort(cmpSillon);
  const cards=list.map(e=>{
    const pe=P[e.expediente];const open=pe?pe.pendientes.filter(x=>!x.hecho).length:0;
    return `<div class="card" data-id="${e.id}">
      <div class="sil"><small>sillón</small><b>${esc(e.sillon||'–')}</b></div>
      <div><div class="nm">${esc(pe&&pe.nombre||'(sin nombre)')}</div><div class="ex">${esc(e.expediente)}</div>
        <div class="chips">${e.fotos&&e.fotos.length?`<span class="chip">📷 ${e.fotos.length}</span>`:''}${open?`<span class="chip w">⏳ ${open} pendiente${open>1?'s':''}</span>`:''}</div>
        ${e.comentario?`<div class="cm">${esc(e.comentario)}</div>`:''}</div>
      <button class="nota ${e.nota?'ok':''}" data-nota="${e.id}">${e.nota?'✓':'○'}<small>nota</small></button></div>`}).join('');
  const showBanner=isIOS&&!standalone&&lsGet('bannerOff')!=='1';
  const esHoy=S.fecha===todayStr();
  $('#main').innerHTML=`
    <div class="top">
      <div class="datebar"><button class="ib" data-d="-1">‹</button>
        <div class="d">${esc(fmtFecha(S.fecha))}<small>${esHoy?'hoy':'<a data-d="0" style="color:var(--ac);text-decoration:underline">ir a hoy</a>'} · notas pendientes: ${pend} de ${ents.length}</small></div>
        <button class="ib" data-d="1">›</button></div>
      <div class="tabs">${tabs}</div></div>
    ${showBanner?`<div class="banner"><div>Para que iOS no borre tus datos, instala la app: botón Compartir → <b>Agregar a pantalla de inicio</b>, y úsala siempre desde ese ícono.</div><button data-bn>×</button></div>`:''}
    ${cards||`<div class="empty">Sin pacientes en el turno ${S.turno}.<br>Toca <b>＋ Paciente</b> para agregar.</div>`}`;
}

async function renderPend(){
  const [pats,ents]=await Promise.all([all('patients'),byDate(todayStr())]);
  const hoy=Object.fromEntries(ents.map(e=>[e.expediente,e]));
  const gs=pats.map(p=>({p,o:p.pendientes.filter(x=>!x.hecho)})).filter(g=>g.o.length)
    .sort((a,b)=>(!!hoy[b.p.expediente])-(!!hoy[a.p.expediente])||String(a.p.nombre).localeCompare(String(b.p.nombre)));
  const total=gs.reduce((s,g)=>s+g.o.length,0);
  $('#main').innerHTML=`<div class="top"><div class="datebar"><div class="d">Pendientes abiertos<small>${total} en ${gs.length} paciente${gs.length===1?'':'s'}</small></div></div></div>`+
   (gs.map(g=>{const h=hoy[g.p.expediente];
     return `<div class="pg"><div class="hd" ${h?`data-open="${h.id}"`:''}><div><div class="nm">${esc(g.p.nombre||'(sin nombre)')}</div><div class="ex">${esc(g.p.expediente)}</div></div>${h?`<span class="chip">hoy · T${h.turno}${h.sillon?' · S'+esc(h.sillon):''}</span>`:''}</div>
     ${g.o.map(x=>`<div class="pr"><button class="ck" data-pt="${x.id}" data-pe="${esc(g.p.expediente)}"></button><span>${esc(x.texto)}</span></div>`).join('')}</div>`}).join('')||`<div class="empty">No hay pendientes abiertos 🎉</div>`);
}

async function renderResp(){
  const [phs,pats,ents]=await Promise.all([all('photos'),all('patients'),all('entries')]);
  const bytes=phs.reduce((s,x)=>s+(x.blob?x.blob.size:0),0);
  let est=null,per=null;
  try{est=await navigator.storage.estimate()}catch(e){}
  try{per=await navigator.storage.persisted()}catch(e){}
  const last=await get('meta','lastBackup');
  const mb=n=>(n/1048576).toFixed(1)+' MB';
  $('#main').innerHTML=`<div class="top"><div class="datebar"><div class="d">Respaldo y almacenamiento</div></div></div>
  <div class="box"><h3>Almacenamiento</h3>
    <p>${pats.length} paciente${pats.length===1?'':'s'} guardado${pats.length===1?'':'s'} · ${ents.length} registro${ents.length===1?'':'s'} de sesión</p>
    <p>${phs.length} foto${phs.length===1?'':'s'} de hoja de signos: ${mb(bytes)}. Se borran solas a los ${DIAS_FOTO} días.</p>
    ${est&&est.quota?`<p>Uso total de la app: ${mb(est.usage||0)}</p>`:''}
    <p>Almacenamiento persistente: ${per===true?'sí ✓':per===false?'no concedido (instala la app en la pantalla de inicio)':'no disponible'}</p>
    <button class="btn sec" id="r-del">Borrar todas las fotos ahora</button></div>
  <div class="box"><h3>Exportar respaldo</h3>
    <p>Último respaldo: ${last?new Date(last.v).toLocaleString('es-MX'):'nunca'}</p>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="r-fot"> Incluir fotos (pesa más)</label>
    <button class="btn" id="r-exp">Exportar archivo</button>
    <p>Se genera un .json; en iPhone sale por el menú de compartir (Archivos, AirDrop, etc.).</p></div>
  <div class="box"><h3>Importar respaldo</h3>
    <p>Combina el archivo con lo que ya tienes; gana el registro más reciente.</p>
    <label class="btn sec" for="r-file">Elegir archivo…</label><input id="r-file" type="file" accept=".json,application/json" hidden></div>
  <div class="box"><h3>Notas</h3><p>Todo se guarda solo en este teléfono. Sin conexión funciona normal una vez instalada. Si cambias de teléfono o reinstalas, exporta antes.</p></div>`;
}

/* ---------- Hojas (sheets) ---------- */
let sheetCb=null;
function openSheet(html){const o=$('#ov');o.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;o.classList.add('on');document.body.classList.add('lock');return o.firstChild}
async function closeSheet(){
  const o=$('#ov');
  if(sheetCb){const f=sheetCb;sheetCb=null;try{await f()}catch(e){console.error(e)}}
  o.classList.remove('on');o.innerHTML='';document.body.classList.remove('lock');render();
}
const turnoOpts=sel=>TURNOS.map(t=>`<option value="${t}" ${t===sel?'selected':''}>Turno ${t}</option>`).join('');

async function openAdd(){
  const pats=await all('patients');
  const sh=openSheet(`<div class="sh-head"><b style="font-size:18px;padding-top:10px">Agregar paciente</b><button data-close>Cerrar</button></div>
    <label>Expediente</label><input id="a-exp" autocomplete="off" autocapitalize="characters" autocorrect="off">
    <label>Nombre</label><input id="a-nom" autocomplete="off">
    <div id="a-sug"></div>
    <div class="row"><div><label>Turno</label><select id="a-tur">${turnoOpts(S.turno)}</select></div>
    <div><label>Sillón</label><input id="a-sil" inputmode="numeric" autocomplete="off"></div></div>
    <div id="a-hint" class="hint"></div>
    <button class="pri" id="a-ok">Agregar a la lista</button>`);
  const exp=$('#a-exp',sh),nom=$('#a-nom',sh),sug=$('#a-sug',sh),hint=$('#a-hint',sh);
  let auto=false;
  const upd=(src)=>{
    const q=(src.value||'').trim().toLowerCase();
    const k=normExp(exp.value);const known=pats.find(p=>p.expediente===k);
    if(known){
      if(!nom.value.trim()||auto){nom.value=known.nombre||'';auto=true}
      const o=known.pendientes.filter(x=>!x.hecho);
      hint.textContent=o.length?`Paciente conocido · ${o.length} pendiente${o.length>1?'s':''} abierto${o.length>1?'s':''}: ${o.map(x=>x.texto).join('; ')}`:'Paciente conocido';
    }else hint.textContent='';
    if(src===nom)auto=false;
    const m=q?pats.filter(p=>p.expediente.toLowerCase().startsWith(q)||String(p.nombre||'').toLowerCase().includes(q)).filter(p=>p.expediente!==k).slice(0,5):[];
    sug.innerHTML=m.map(p=>`<button data-sg="${esc(p.expediente)}">${esc(p.nombre||'(sin nombre)')} <small>· ${esc(p.expediente)}</small></button>`).join('');
  };
  exp.addEventListener('input',()=>upd(exp));nom.addEventListener('input',()=>upd(nom));
  sug.addEventListener('click',ev=>{const b=ev.target.closest('[data-sg]');if(!b)return;const p=pats.find(x=>x.expediente===b.dataset.sg);exp.value=p.expediente;nom.value=p.nombre||'';auto=true;upd(exp);sug.innerHTML=''});
  $('#a-ok',sh).onclick=()=>addEntry(exp.value,nom.value,+$('#a-tur',sh).value,$('#a-sil',sh).value);
  setTimeout(()=>exp.focus(),50);
}

async function addEntry(expRaw,nom,tur,sil){
  const exp=normExp(expRaw);if(!exp){toast('Falta el expediente');return}
  nom=nom.trim();sil=sil.trim();
  let pat=await get('patients',exp);
  if(!pat)pat={expediente:exp,nombre:'',pendientes:[],updatedAt:now()};
  if(nom&&nom!==pat.nombre){pat.nombre=nom;pat.updatedAt=now()}
  await put('patients',pat);
  const ents=await byDate(S.fecha);
  const dup=ents.find(e=>e.expediente===exp);
  if(dup){
    if(dup.turno===tur){toast('Ya está en este turno');S.turno=tur;await closeSheet();openEntry(dup.id);return}
    if(confirm(`${pat.nombre||exp} ya está en la lista de esta fecha (turno ${dup.turno}${dup.sillon?', sillón '+dup.sillon:''}). ¿Moverlo al turno ${tur}?`)){
      dup.turno=tur;if(sil)dup.sillon=sil;dup.updatedAt=now();await put('entries',dup);S.turno=tur;lsSet('turno',tur);
      await closeSheet();openEntry(dup.id);
    }
    return;
  }
  const e={id:uid(),fecha:S.fecha,turno:tur,sillon:sil,expediente:exp,comentario:'',nota:false,fotos:[],extras:{},creado:now(),updatedAt:now()};
  await put('entries',e);S.turno=tur;lsSet('turno',tur);
  await closeSheet();openEntry(e.id);
}

async function openEntry(id){
  const e=await get('entries',id);if(!e)return;
  if(!e.fotos)e.fotos=[];if(!e.extras)e.extras={};
  const pat=(await get('patients',e.expediente))||{expediente:e.expediente,nombre:'',pendientes:[],updatedAt:now()};
  const urls=[];
  const ex=e.extras;
  const sh=openSheet(`
    <div class="sh-head"><div style="flex:1"><input id="e-nom" class="nm-in" placeholder="Nombre del paciente" value="${esc(pat.nombre)}"><div class="ex" style="margin-top:4px">Exp. ${esc(e.expediente)} · ${esc(fmtFecha(e.fecha))}</div></div><button data-close>Listo</button></div>
    <div class="row"><div><label>Turno</label><select id="e-tur">${turnoOpts(e.turno)}</select></div><div><label>Sillón</label><input id="e-sil" inputmode="numeric" value="${esc(e.sillon)}"></div></div>
    <button class="notabig" id="e-nota"></button>
    <h4>Hoja de signos</h4><div class="thumbs" id="e-fotos"></div>
    <label class="btn" for="e-file">📷 Agregar foto</label><input id="e-file" type="file" accept="image/*" hidden multiple>
    <h4>Comentario</h4><textarea id="e-com" rows="4" placeholder="Comentarios del pase…">${esc(e.comentario)}</textarea>
    <h4>Pendientes de este paciente</h4><div id="e-pend"></div>
    <div class="addrow"><input id="e-pin" placeholder="Nuevo pendiente…" enterkeyhint="done" autocomplete="off"><button id="e-padd">+</button></div>
    <details><summary>Datos de la sesión (opcional)</summary>
      <div class="row"><div><label>Peso seco</label><input id="x-peso" value="${esc(ex.peso)}"></div><div><label>Ganancia interdialítica</label><input id="x-gan" value="${esc(ex.gan)}"></div></div>
      <div class="row"><div><label>TA</label><input id="x-ta" value="${esc(ex.ta)}"></div><div><label>Otros</label><input id="x-otro" value="${esc(ex.otro)}"></div></div></details>
    <button class="dng" id="e-del">Quitar de la lista</button>`);
  const q=s=>$(s,sh);
  let tm=null,dirtyPat=false;
  const flush=async()=>{clearTimeout(tm);tm=null;
    e.comentario=q('#e-com').value;e.sillon=q('#e-sil').value.trim();
    e.extras={peso:q('#x-peso').value,gan:q('#x-gan').value,ta:q('#x-ta').value,otro:q('#x-otro').value};
    e.updatedAt=now();await put('entries',e);
    const nn=q('#e-nom').value.trim();if(nn!==pat.nombre){pat.nombre=nn;dirtyPat=true}
    if(dirtyPat){pat.updatedAt=now();await put('patients',pat);dirtyPat=false}};
  const later=()=>{clearTimeout(tm);tm=setTimeout(()=>flush().catch(console.error),400)};
  sheetCb=async()=>{await flush();urls.forEach(u=>URL.revokeObjectURL(u))};
  ['#e-com','#e-sil','#e-nom','#x-peso','#x-gan','#x-ta','#x-otro'].forEach(s=>q(s).addEventListener('input',later));
  q('#e-tur').onchange=async ev=>{e.turno=+ev.target.value;S.turno=e.turno;lsSet('turno',e.turno);await flush()};
  const drawNota=()=>{const b=q('#e-nota');b.className='notabig'+(e.nota?' ok':'');b.textContent=e.nota?'✓ Nota hecha':'○ Nota pendiente — toca para marcar'};
  q('#e-nota').onclick=async()=>{e.nota=!e.nota;drawNota();await flush()};drawNota();

  const drawPend=()=>{
    const row=x=>`<div class="pr ${x.hecho?'dn':''}"><button class="ck ${x.hecho?'on':''}" data-pt="${x.id}">${x.hecho?'✓':''}</button><span>${esc(x.texto)}</span><button class="x" data-px="${x.id}">×</button></div>`;
    const open=pat.pendientes.filter(x=>!x.hecho),done=pat.pendientes.filter(x=>x.hecho);
    q('#e-pend').innerHTML=(open.length?open.map(row).join(''):'<div class="mu">Sin pendientes abiertos</div>')+(done.length?`<details><summary>Resueltos (${done.length})</summary>${done.map(row).join('')}</details>`:'');
  };
  drawPend();
  q('#e-pend').addEventListener('click',async ev=>{
    const t=ev.target.closest('[data-pt]'),x=ev.target.closest('[data-px]');
    if(t){const p=pat.pendientes.find(z=>z.id===t.dataset.pt);p.hecho=!p.hecho;p.hechoEn=p.hecho?now():null}
    else if(x){pat.pendientes=pat.pendientes.filter(z=>z.id!==x.dataset.px)}
    else return;
    dirtyPat=true;await flush();drawPend();
  });
  const addP=async()=>{const i=q('#e-pin');const t=i.value.trim();if(!t)return;
    pat.pendientes.push({id:uid(),texto:t,hecho:false,creado:now()});i.value='';dirtyPat=true;await flush();drawPend()};
  q('#e-padd').onclick=addP;q('#e-pin').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();addP()}});

  const drawFotos=async()=>{
    urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
    const keep=[];let html='';
    for(const fid of e.fotos){
      const ph=await get('photos',fid);if(!ph)continue;keep.push(fid);
      const u=URL.createObjectURL(ph.blob);urls.push(u);
      const left=Math.max(0,Math.ceil((ph.created+DIAS_FOTO*DAY-now())/DAY));
      html+=`<div class="th" data-ph="${fid}" data-u="${u}"><img src="${u}" alt="Hoja de signos"><small>se borra en ${left} d</small></div>`;
    }
    if(keep.length!==e.fotos.length){e.fotos=keep;await flush()}
    q('#e-fotos').innerHTML=html||'<div class="mu">Sin fotos</div>';
  };
  await drawFotos();
  q('#e-fotos').addEventListener('click',ev=>{const t=ev.target.closest('[data-ph]');if(!t)return;
    viewPhoto(t.dataset.u,async()=>{await del('photos',t.dataset.ph);e.fotos=e.fotos.filter(i=>i!==t.dataset.ph);await flush();await drawFotos()})});
  q('#e-file').onchange=async ev=>{
    const files=[...ev.target.files];ev.target.value='';if(!files.length)return;
    toast('Guardando foto…');
    for(const f of files){try{
      const blob=await compress(f);const ph={id:uid(),blob,created:now(),entry:e.id,expediente:e.expediente};
      await put('photos',ph);e.fotos.push(ph.id);
    }catch(err){console.error(err);toast('No se pudo procesar la foto')}}
    await flush();await drawFotos();toast('Foto guardada');
  };
  q('#e-del').onclick=async()=>{
    if(!confirm('¿Quitar a este paciente de la lista de esta fecha? Se borran sus fotos de hoja de signos; el paciente y sus pendientes se conservan.'))return;
    sheetCb=null;clearTimeout(tm);
    for(const fid of e.fotos)await del('photos',fid);
    await del('entries',e.id);urls.forEach(u=>URL.revokeObjectURL(u));closeSheet();
  };
}

/* ---------- Fotos ---------- */
function compress(file,max=1600,qual=.72){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',qual);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;});}

let vwDel=null;
function viewPhoto(url,onDelete){
  $('#v-img').src=url;$('#vw').classList.remove('z');$('#vw').classList.add('on');vwDel=onDelete;
}
$('#v-x').onclick=()=>{$('#vw').classList.remove('on');$('#v-img').removeAttribute('src');vwDel=null};
$('#v-zoom').onclick=()=>$('#vw').classList.toggle('z');
$('#v-del').onclick=async()=>{if(!vwDel||!confirm('¿Borrar esta foto?'))return;const f=vwDel;$('#v-x').onclick();await f()};

async function purge(){
  const lim=now()-DIAS_FOTO*DAY;let n=0;const gone=new Set();
  for(const p of await all('photos'))if(p.created<lim){await del('photos',p.id);gone.add(p.id);n++}
  if(gone.size)for(const e of await all('entries')){
    const k=(e.fotos||[]).filter(i=>!gone.has(i));
    if(k.length!==(e.fotos||[]).length){e.fotos=k;e.updatedAt=now();await put('entries',e)}}
  return n;
}

/* ---------- Respaldo ---------- */
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function exportar(conFotos){
  const data={app:'pase-hd',version:1,exportado:now(),patients:await all('patients'),entries:await all('entries'),photos:[]};
  if(conFotos)for(const ph of await all('photos'))data.photos.push({id:ph.id,created:ph.created,entry:ph.entry,expediente:ph.expediente,data:await blobToData(ph.blob)});
  const name=`pase-hd-${todayStr()}.json`;
  const file=new File([JSON.stringify(data)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});await put('meta',{k:'lastBackup',v:now()});return true}
    catch(err){if(err&&err.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  await put('meta',{k:'lastBackup',v:now()});return true;
}
async function importar(file){
  const d=JSON.parse(await file.text());if(!d||d.app!=='pase-hd')throw new Error('Archivo no válido');
  const merge=async(st,arr,key)=>{let n=0;for(const r of arr||[]){const cur=await get(st,r[key]);if(!cur||(r.updatedAt||0)>(cur.updatedAt||0)){await put(st,r);n++}}return n};
  const a=await merge('patients',d.patients,'expediente'),b=await merge('entries',d.entries,'id');
  for(const ph of d.photos||[])if(!(await get('photos',ph.id))){
    const blob=await (await fetch(ph.data)).blob();await put('photos',{id:ph.id,blob,created:ph.created,entry:ph.entry,expediente:ph.expediente})}
  await purge();return {a,b};
}

/* ---------- Eventos globales ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target;
  const nav=t.closest('nav button');if(nav){S.view=nav.dataset.v;render();window.scrollTo(0,0);return}
  if(t.closest('#fab')){openAdd();return}
  if(t.closest('[data-close]')){closeSheet();return}
  if(t.id==='ov'){closeSheet();return}
  if(t.closest('[data-bn]')){lsSet('bannerOff','1');render();return}
  const dn=t.closest('[data-d]');
  if(dn&&S.view==='hoy'){const v=+dn.dataset.d;
    if(v===0)S.fecha=todayStr();else{const d=new Date(S.fecha+'T12:00:00');d.setDate(d.getDate()+v);S.fecha=todayStr(d)}
    S.hoy=S.fecha===todayStr();render();return}
  const tab=t.closest('[data-t]');if(tab){S.turno=+tab.dataset.t;lsSet('turno',S.turno);render();return}
  const nt=t.closest('[data-nota]');
  if(nt){const e=await get('entries',nt.dataset.nota);e.nota=!e.nota;e.updatedAt=now();await put('entries',e);render();return}
  const pt=t.closest('[data-pt][data-pe]');
  if(pt){const p=await get('patients',pt.dataset.pe);const x=p.pendientes.find(z=>z.id===pt.dataset.pt);x.hecho=true;x.hechoEn=now();p.updatedAt=now();await put('patients',p);render();toast('Pendiente resuelto');return}
  const op=t.closest('[data-open]');if(op){openEntry(op.dataset.open);return}
  const card=t.closest('.card[data-id]');if(card){openEntry(card.dataset.id);return}
  if(t.id==='r-del'){if(confirm('¿Borrar TODAS las fotos de hojas de signos?')){
    for(const p of await all('photos'))await del('photos',p.id);
    for(const e of await all('entries'))if(e.fotos&&e.fotos.length){e.fotos=[];e.updatedAt=now();await put('entries',e)}
    toast('Fotos borradas');render()}return}
  if(t.id==='r-exp'){const ok=await exportar($('#r-fot').checked);if(ok){toast('Respaldo listo');render()}return}
});
document.addEventListener('change',async ev=>{
  if(ev.target.id==='r-file'){const f=ev.target.files[0];ev.target.value='';if(!f)return;
    try{const r=await importar(f);toast(`Importado: ${r.a} pacientes, ${r.b} registros`);render()}catch(err){alert('No se pudo importar: '+err.message)}}
});

/* ---------- Inicio ---------- */
(async()=>{
  try{db=await openDB()}catch(e){$('#main').innerHTML='<div class="empty">Este navegador no permite guardar datos locales (¿modo privado?).</div>';return}
  await purge();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await render();
  setInterval(()=>purge().catch(()=>{}),36e5);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible')return;
    await purge().catch(()=>{});
    if(S.hoy&&S.fecha!==todayStr())S.fecha=todayStr();
    if(!$('#ov').classList.contains('on'))render();
  });
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
