}

<script>
'use strict';
const VERSION='11.65';
const TURNOS=[1,2,3,4,5];
const DIAS_FOTO=7;
const EV_DEF=['Hipotensión','Hipertensión','Calambres','Náuseas / vómito','Cefalea','Dolor torácico','Arritmia','Disnea','Problema de acceso','Coagulación del circuito','Sangrado','Fiebre / escalofríos','Alarma de máquina','Terminó antes de tiempo'];
const evNom=x=>x.k+(x.n&&x.n.trim()?' ('+x.n.trim()+')':'');
const evFrase=evs=>', cursando con eventualidades durante el transcurso: '+evs.map(evNom).join(', ')+'.';
const evRe=/,?\s*sin cursar con eventualidades[^.\n]*\.?/i;
function evAplica(txt,evs){if(!evs||!evs.length)return {t:txt,ok:true};if(!evRe.test(txt))return {t:txt,ok:false};return {t:txt.replace(evRe,evFrase(evs)),ok:true}}
const evList=()=>{try{const v=JSON.parse(lsGet('evList')||'null');if(Array.isArray(v)&&v.length)return v}catch(_){}return EV_DEF};
const accOpen=k=>{try{return JSON.parse(lsGet('acc')||'{}')[k]?' open':''}catch(_){return ''}};
document.addEventListener('toggle',ev=>{const d=ev.target;if(!d||!d.dataset||!d.dataset.acc)return;try{const o=JSON.parse(lsGet('acc')||'{}');o[d.dataset.acc]=d.open?1:0;lsSet('acc',JSON.stringify(o))}catch(_){}},true);
const DIAS=[['L','Lun'],['M','Mar'],['X','Mié'],['J','Jue'],['V','Vie'],['S','Sáb'],['D','Dom']];
const ACCESOS=['FAV','Injerto','Catéter tunelizado','Catéter temporal'];
const DEF_EXF='A la exploración física se encuentra neurológico integra, adecuado color tegumentario, cuello sin adenomegalias, no plétora yugular. Cardiopulmonar sin compromiso aparente, campos pulmonares ventilados sin estertores ni sibilancias. Abdomen asignológico, extremidades integras, sin presencia de edema.';
const DEF_TAGS=['Disfunción de catéter','Sangrado / hematoma','Sospecha de infección','Hipotensión','Hipertensión','Calambres','Náusea / vómito','Dolor torácico / arritmia','Ganancia alta','Sesión incompleta','Laboratorio','Interconsulta'];
const DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const todayStr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const fmtFecha=s=>new Date(s+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const normExp=s=>String(s||'').trim().toUpperCase();
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
// Expediente tal como lo pide el sistema de la clínica: prefijo (RL, LE…) + número. Si ya trae letras, se respeta.
const SUBJ_DEF='Subjetivo: Paciente proveniente de domicilio. Paciente se refiere asintomática al ingreso. Niega nauseas, vomito, diarrea y sangrados. Sin requerimiento de oxigeno suplementario.';
const subjTxt=()=>{const v=lsGet('subjTxt');return v&&v.trim()?v:SUBJ_DEF};
const subjOn=()=>lsGet('subjOn')!=='0';
// ---- Receta: posiciones calculadas del formato de la hoja (A4, 7 col. de 66 pt + H de 51 pt, filas de 15.75 pt, ajustada al ancho con márgenes de 0.7 in)
const RX={rowPt:15.75,colPt:66,hPt:51,ml:17.78,mt:19.05,printable:174.44};
const rxCfg=()=>({dx:+lsGet('rxDx')||0,dy:+lsGet('rxDy')||0,sc:(+lsGet('rxSc')||100)});
const rxIdxB=()=>lsGet('rxIdxB')!=='0';
const rxHdrOn=()=>lsGet('rxHdr')!=='0';
const rxHdrTxt=()=>((lsGet('rxHdrTxt')||'').trim()||'TRATAMIENTO:');
const rxKey=x=>'rx:'+x;
const rxLoad=x=>{try{return JSON.parse(lsGet(rxKey(x))||'{}')}catch(e){return {}}};
const rxFechaTxt=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()};
function rxHTML(f,scalePxPerMm){
  // devuelve HTML con cajas en mm; scalePxPerMm solo para la vista previa
  const c=rxCfg(),totalPt=7*RX.colPt+RX.hPt;
  const sc=(RX.printable*(72/25.4)/totalPt)*(c.sc/100);   // factor de ajuste al ancho (como "ajustar a una página de ancho")
  const mm=pt=>pt*sc*25.4/72;
  const X0=RX.ml+c.dx,Y0=RX.mt+c.dy;
  const box=(col0,colW,row,rows,txt,al,wrap,bold)=>`<div style="position:absolute;left:${X0+mm(col0)}mm;top:${Y0+mm((row-1)*RX.rowPt)}mm;width:${mm(colW)}mm;height:${mm(rows*RX.rowPt)}mm;display:flex;align-items:flex-end;justify-content:${al==='c'?'center':al==='r'?'flex-end':'flex-start'};font:${bold?'bold ':''}${12*sc}pt Arial,Helvetica,sans-serif;line-height:${mm(RX.rowPt)}mm;overflow:hidden;box-sizing:border-box;padding:0 ${mm(2)}mm;text-align:${al==='c'?'center':al==='r'?'right':'left'};white-space:${wrap?'normal':'nowrap'};word-break:break-word"><div style="width:100%">${esc(String(txt||'').toUpperCase()).replace(/\n/g,'<br>')}</div></div>`;
  let h='';
  h+=box(0,4*RX.colPt,4,1,f.nombre,'c');
  h+=box(5*RX.colPt,RX.colPt,4,1,f.edad,'r');
  h+=box(6*RX.colPt,RX.colPt+RX.hPt,4,1,f.fecha,'r');
  h+=box(0,7*RX.colPt,7,2,f.idx,'l',1,rxIdxB());
  (f.lineas||[]).slice(0,7).forEach((t,i)=>{if(t&&t.trim())h+=box(0,7*RX.colPt,9+2*i,2,t,'l',1)});
  if(rxHdrOn()&&!((f.lineas||[])[0]||'').trim())h+=box(0,7*RX.colPt,9,2,rxHdrTxt(),'l',0,1);
  return h}
function openReceta(nombre,exp,dxHint){
  const saved=rxLoad(exp);
  const f={nombre:nombre||'',edad:saved.edad||'',fecha:rxFechaTxt(),idx:saved.idx!==undefined?saved.idx:(dxHint?'IDX: '+dxHint:'IDX: '),lineas:saved.lineas&&saved.lineas.length?saved.lineas.slice(0,7):[]};
  while(f.lineas.length<7)f.lineas.push('');
  const c=rxCfg();
  const box=$('#rx-c');
  const el=(id,lab,val,extra='')=>`<div><label for="${id}">${lab}</label><input id="${id}" value="${esc(val)}" autocomplete="off" ${extra}></div>`;
  box.innerHTML=`<div class="rxg">${el('rx-nom','Nombre',f.nombre)}${el('rx-edad','Edad (ej. 52 AÑOS)',f.edad)}${el('rx-fec','Fecha',f.fecha)}</div>
   <label for="rx-idx">Diagnóstico (IDX)</label><textarea id="rx-idx" rows="2">${esc(f.idx)}</textarea>
   <label>Indicaciones / solicitudes (cada una ocupa 2 renglones de la receta)</label>
   ${f.lineas.map((t,i)=>`<textarea data-rxl="${i}" rows="2" placeholder="${i===0?'(la primera queda como espacio, igual que en tu Excel, si la dejas vacía)':'Línea '+(i+1)}">${esc(t)}</textarea>`).join('')}
   <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px"><input type="checkbox" id="rx-idxb" ${rxIdxB()?'checked':''} style="width:auto;min-height:0"> Diagnóstico (IDX) en negritas</label>
   <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px"><input type="checkbox" id="rx-hdr" ${rxHdrOn()?'checked':''} style="width:auto;min-height:0"> Poner «${esc(rxHdrTxt())}» en negritas entre el diagnóstico y los medicamentos <span class="mu">(solo si la 1ª línea está vacía)</span></label>
   <div style="margin-top:8px"><button type="button" class="btn2 sec" id="rx-clr">Limpiar indicaciones</button></div>
   <details style="margin-top:10px"><summary>Ajustar posición de impresión</summary>
     <p class="mu">Si al imprimir sobre la receta algo queda corrido, mueve en milímetros (positivo = derecha / abajo). Se recuerda en este dispositivo.</p>
     <div class="rxo"><div><label for="rx-dx">Derecha/izquierda (mm)</label><input id="rx-dx" type="number" step="0.5" value="${c.dx}"></div><div><label for="rx-dy">Abajo/arriba (mm)</label><input id="rx-dy" type="number" step="0.5" value="${c.dy}"></div><div><label for="rx-sc">Tamaño (%)</label><input id="rx-sc" type="number" step="1" value="${c.sc}"></div></div></details>
   <b style="display:block;margin-top:10px">Vista previa (A4)</b><div id="rxprev"></div>`;
  const cur=()=>({nombre:$('#rx-nom').value,edad:$('#rx-edad').value,fecha:$('#rx-fec').value,idx:$('#rx-idx').value,lineas:[...box.querySelectorAll('[data-rxl]')].map(x=>x.value)});
  const prev=()=>{const pv=$('#rxprev');const k=pvK();pv.innerHTML=`<div style="transform:scale(${k});transform-origin:0 0;width:210mm;height:297mm;position:relative">${rxHTML(cur())}</div>`};
  const persist=()=>{const v=cur();try{lsSet(rxKey(exp),JSON.stringify({edad:v.edad,idx:v.idx,lineas:v.lineas}))}catch(e){}};
  box.oninput=ev=>{if(ev.target.id==='rx-idxb'){lsSet('rxIdxB',ev.target.checked?'1':'0');prev();return}if(ev.target.id==='rx-hdr'){lsSet('rxHdr',ev.target.checked?'1':'0');prev();return}if(ev.target.id==='rx-dx')lsSet('rxDx',ev.target.value);if(ev.target.id==='rx-dy')lsSet('rxDy',ev.target.value);if(ev.target.id==='rx-sc')lsSet('rxSc',ev.target.value);persist();prev()};
  $('#rx-clr').onclick=()=>{box.querySelectorAll('[data-rxl]').forEach(x=>x.value='');persist();prev()};
  $('#rx-x').onclick=()=>{$('#rxm').classList.remove('on');document.body.classList.remove('lock')};
  $('#rx-print').onclick=()=>{persist();rxPrint(rxPage(rxHTML(cur())))};
  $('#rx-pdf').onclick=async()=>{persist();const v=cur();await rxShare(pdfBuild([rxOps(v)]),'receta_'+pdfSan(v.nombre)+'.pdf')};

const pStamp=x=>x.updatedAt||x.hechoEn||x.creado||0;

const venceTxt=(x,ref)=>{if(!x.vence)return '';ref=ref||todayStr();const d=diasEntre(x.vence,ref);return d>0?`venció hace ${d} d`:d===0?'vence hoy':'vence '+fmtFecha(x.vence)};

// Une dos copias de un paciente (importar archivo): perfil por fecha de perfil, pendientes uno por uno.
function mergePat(cur,r){
  if(!cur)return r;
  const out={...cur};
  if(patStamp(r)>patStamp(cur)){out.nombre=r.nombre;out.acceso=r.acceso;out.aviso=r.aviso;out.notaFija=r.notaFija;out.sexo=r.sexo;if(r.dias!==undefined)out.dias=r.dias;if(r.turnoHab!==undefined)out.turnoHab=r.turnoHab;if(r.plantilla!==undefined)out.plantilla=r.plantilla;if(r.ficha!==undefined)out.ficha=r.ficha;if(r.labs!==undefined)out.labs=r.labs;if(r.labPlan!==undefined)out.labPlan=r.labPlan;out.pu=patStamp(r)}
  const m=new Map((cur.pendientes||[]).map(x=>[x.id,x]));
  for(const x of r.pendientes||[]){const c=m.get(x.id);if(!c||pStamp(x)>pStamp(c))m.set(x.id,x)}
  out.pendientes=[...m.values()];
  out.updatedAt=Math.max(cur.updatedAt||0,r.updatedAt||0);
  return out;
}

/* ---------- Calculadora simple (suma, resta, multiplicación, división, %, signo) ---------- */
const C={disp:'0',acc:null,op:null,fresh:true,rep:false,eq:false,expr:''};
const COPS={'+':'+','-':'−','*':'×','/':'÷'};
const cFmt=n=>isFinite(n)?String(parseFloat(n.toPrecision(12))):'Error';
function cCalc(a,op,b){return op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:op==='/'?(b===0?NaN:a/b):b}
function calcReset(){C.disp='0';C.acc=null;C.op=null;C.fresh=true;C.rep=false;C.eq=false;C.expr=''}
function calcShow(){
  const root=$('#calc-floating')||document;const n=$('#c-disp',root);if(!n)return;
  n.textContent=C.disp;
  n.className='cnum'+(C.disp.length>14?' xs':C.disp.length>9?' sm':'');
  $('#c-expr',root).textContent=C.expr||' ';
}
function calcKey(k){
  if(C.disp==='Error'&&k!=='C'){calcReset()}
  const cur=parseFloat(C.disp);
  if(/^[0-9]$/.test(k)){
    if(C.fresh||C.rep){C.disp=k;C.fresh=false;C.rep=false;if(C.eq){C.expr='';C.eq=false}}
    else if(C.disp==='0')C.disp=k;
    else if(C.disp.replace(/[-.]/g,'').length<12)C.disp+=k;
  }else if(k==='.'){
    if(C.fresh||C.rep){C.disp='0.';C.fresh=false;C.rep=false;if(C.eq){C.expr='';C.eq=false}}
    else if(!C.disp.includes('.'))C.disp+='.';
  }else if(k==='+'||k==='-'||k==='*'||k==='/'){
    if(C.op!==null&&C.acc!==null&&!C.fresh){
      const r=cCalc(C.acc,C.op,cur);
      if(!isFinite(r)){calcReset();C.disp='Error';calcShow();return}
      C.acc=r;C.disp=cFmt(r);
    }else if(C.op===null||C.acc===null)C.acc=cur;
    C.op=k;C.fresh=true;C.rep=false;C.eq=false;C.expr=cFmt(C.acc)+' '+COPS[k];
  }else if(k==='='){
    if(C.op!==null&&C.acc!==null){
      const r=cCalc(C.acc,C.op,cur);
      C.expr=cFmt(C.acc)+' '+COPS[C.op]+' '+cFmt(cur)+' =';
      C.disp=isFinite(r)?cFmt(r):'Error';
      C.acc=null;C.op=null;C.fresh=true;C.rep=false;C.eq=true;
    }
  }else if(k==='%'){
    const v=(C.op==='+'||C.op==='-')&&C.acc!==null?C.acc*cur/100:cur/100;
    C.disp=cFmt(v);C.rep=true;C.fresh=false;
  }else if(k==='pm'){
    if(C.disp!=='0')C.disp=C.disp[0]==='-'?C.disp.slice(1):'-'+C.disp;
  }else if(k==='B'){
    if(!C.fresh&&!C.rep)C.disp=(C.disp.length>1&&!(C.disp.length===2&&C.disp[0]==='-'))?C.disp.slice(0,-1):'0';
  }else if(k==='C')calcReset();
  calcShow();
}
function renderCalc(){
  const keys=[['C','fn','C'],['B','fn','⌫'],['%','fn','%'],['/','op','÷'],['7'],['8'],['9'],['*','op','×'],['4'],['5'],['6'],['-','op','−'],['1'],['2'],['3'],['+','op','+'],['pm','fn','±'],['0'],['.',' ','.'],['=','eq','=']];
  $('#main').innerHTML=`<div class="top"><div class="datebar"><div class="d">Calculadora<small>Diferencias de peso, volumen, etc.</small></div></div></div>
    <div class="calc"><div class="cdisp"><div class="cexpr" id="c-expr">&nbsp;</div><div class="cnum" id="c-disp">0</div></div>
    <div class="ckeys">${keys.map(([k,c,l])=>`<button class="kb ${c||''}" data-k="${k}">${l||k}</button>`).join('')}</div>
    <p class="mu" style="text-align:center;margin-top:12px">Ejemplo: peso actual − peso seco = ganancia de peso. También funciona con el teclado.</p></div>`;
  calcShow();
}
// teclado físico (iPad con teclado, Windows): solo en la pestaña Calc y sin otra ventana abierta
function calcFromKeyboard(ev){
  if(S.view!=='calc'||sheetEl||$('#vw').classList.contains('on'))return false;
  const tg=ev.target&&ev.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return false;
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return false;
  const k=ev.key;let m=null;
  if(/^[0-9]$/.test(k))m=k;
  else if(k==='.'||k===',')m='.';
  else if(k==='+'||k==='-'||k==='*'||k==='/')m=k;
  else if(k==='Enter'||k==='=')m='=';
  else if(k==='Backspace')m='B';
  else if(k==='Escape'||k==='Delete'||k==='c'||k==='C')m='C';
  else if(k==='%')m='%';
  if(m===null)return false;
  ev.preventDefault();calcKey(m);return true;
}

/* ---------- Hojas (sheets): modal en pantallas chicas, panel derecho en grandes ---------- */
let sheetCb=null,sheetEl=null,sheetDocked=false,live=null,lastClose=Promise.resolve();
const sheetOpen=()=>!!sheetEl;
const settle=()=>Promise.race([lastClose,new Promise(r=>setTimeout(r,600))]);
function refreshList(){if(sheetDocked&&sheetEl){clearTimeout(refreshList.t);refreshList.t=setTimeout(()=>render().catch(()=>{}),250)}}
function openSheet(html){
  if(sheetEl)closeSheet(true);
  const pn=$('#pane');const docked=isWide()&&!!pn&&getComputedStyle(pn).display!=='none';sheetDocked=docked;
  const host=docked?$('#pane'):$('#ov');
  host.innerHTML=`<div class="sheet ${docked?'docked':''}" role="dialog">${html}</div>`;
  if(!docked){host.classList.add('on');document.body.classList.add('lock')}
  sheetEl=host.firstChild;
  return sheetEl;
}
// Cierra de inmediato; el guardado pendiente se termina en segundo plano y nunca bloquea el cierre.
function closeSheet(skipRender){
  if(!sheetEl)return Promise.resolve();
  const host=sheetDocked?$('#pane'):$('#ov');
  const f=sheetCb;sheetCb=null;sheetEl=null;live=null;S.sel=null;
  host.classList.remove('on');host.innerHTML='';document.body.classList.remove('lock');
  const done=Promise.resolve().then(()=>f&&f()).catch(err=>logErr('guardar',err));
  lastClose=done;
  if(skipRender!==true){render().catch(()=>{});done.then(()=>render()).catch(()=>{})}
  return done;
}

/* ---------- Buscador de pacientes (pantalla Pase) ---------- */
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let sCache={t:0,fecha:'',last:{},today:{}};
async function searchIndex(){
  if(now()-sCache.t<15000&&sCache.fecha===S.fecha)return sCache;
  const last={},today={};
  for(const e of await all('entries')){if(e.deleted)continue;
    if(!last[e.expediente]||(e.fecha||'')>last[e.expediente])last[e.expediente]=e.fecha||'';
    if(e.fecha===S.fecha)today[e.expediente]=e}
  sCache={t:now(),fecha:S.fecha,last,today};return sCache;
}
async function drawSearch(){
  const inp=$('#s-q'),box=$('#s-res');if(!inp||!box)return;
  const qv=inp.value.trim();S.q=qv;
  if(!qv){box.innerHTML='';return}
  const [pats,ix]=await Promise.all([all('patients'),searchIndex()]);
  if(inp.value.trim()!==qv)return;
  const toks=fold(qv).split(/\s+/).filter(Boolean);
  const m=pats.filter(p=>{const h=fold((p.nombre||'')+' '+p.expediente);return toks.every(t=>h.includes(t))})
    .sort((a,b)=>(!!ix.today[b.expediente])-(!!ix.today[a.expediente])||(a.nombre||'').localeCompare(b.nombre||'')).slice(0,8);
  const cuando=S.fecha===todayStr()?'hoy':'esta fecha';
  const row=p=>{const t=ix.today[p.expediente],l=ix.last[p.expediente];
    return `<div class="sr" data-sexp="${esc(p.expediente)}"><div class="sr-m"><div class="nm">${esc(p.nombre||'(sin nombre)')}</div><div class="ex">${esc(p.expediente)}${p.acceso?' · '+esc(p.acceso):''}${p.aviso?' · '+esc(p.aviso):''}</div><div class="mu" style="font-size:12px">${t?`En la lista de ${cuando} · T${esc(t.turno)}${t.sillon?' · sillón '+esc(t.sillon):''}`:l?`Última sesión ${esc(fmtFecha(l))} · toca para agregar a ${cuando}`:'Sin sesiones · toca para agregar'}</div></div><button type="button" class="mini" data-shist="${esc(p.expediente)}">Historial</button></div>`};
  const exists=pats.some(p=>p.expediente===normExp(qv));
  box.innerHTML=m.map(row).join('')+(exists?'':`<div class="sr new" data-snew="${esc(qv)}">Agregar «${esc(qv)}» como paciente nuevo</div>`);
}

async function pickPatient(exp){

async function copyText(t){

  try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(err){return false}

/* ---------- Cargar el turno desde la sesión anterior del mismo grupo (L-M-V / M-J-S) ---------- */
const addDays=(f,n)=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return todayStr(d)};
// lunes y martes miran 3 días atrás (viernes/sábado); miércoles a sábado miran 2 días atrás
const fechaBase=f=>{const w=new Date(f+'T12:00:00').getDay();return addDays(f,(w===1||w===2)?-3:-2)};
async function listaOrigen(src,turno){return(await byDate(src)).filter(x=>x.turno===turno&&!x.temp).sort(cmpSillon)}
async function cargarDesde(fecha,turno,src){
  const orig=await listaOrigen(src,turno);
  const hoy=await byDate(fecha);const ya=new Set(hoy.map(x=>x.expediente));
  let add=0,omit=0;
  for(const o of orig){
    if(ya.has(o.expediente)){omit++;continue}
    await put('entries',{id:'p-'+fecha+'-'+o.expediente,fecha,turno,sillon:'',expediente:o.expediente,comentario:'',nota:false,notaTxt:'',fotos:[],tags:await tagsHeredadas(o.expediente,fecha),extras:{},creado:now()+add,updatedAt:now()});
    ya.add(o.expediente);add++}
  return{add,omit,total:orig.length}
}
async function addEntry(expRaw,nom,tur,sil,rapid=false){
  const exp=normExp(expRaw);if(!exp){toast('Falta el expediente');return}
  nom=nom.trim();sil=sil.trim();
  let pat=await get('patients',exp);
  if(!pat)pat={expediente:exp,nombre:'',pendientes:[],updatedAt:now(),pu:now()};
  if(pat.deleted){pat.deleted=false;pat.updatedAt=now();pat.pu=now()}
  if(nom&&nom!==pat.nombre){pat.nombre=nom;pat.updatedAt=now();pat.pu=now()}
  await put('patients',pat);
  const ents=await byDate(S.fecha);
  const dup=ents.find(e=>e.expediente===exp);
  if(dup){
    if(dup.turno===tur){toast('Ya está en este turno');if(!rapid){S.turno=tur;closeSheet();openEntry(dup.id)}return 'duplicate'}
    if(confirm(`${pat.nombre||exp} ya está en la lista de esta fecha (turno ${dup.turno}${dup.sillon?', sillón '+dup.sillon:''}). ¿Moverlo al turno ${tur}?`)){
      dup.turno=tur;if(sil)dup.sillon=sil;dup.updatedAt=now();await put('entries',dup);S.turno=tur;lsSet('turno',tur);
      closeSheet();openEntry(dup.id);
    }
    return;
  }
  const e={id:uid(),fecha:S.fecha,turno:tur,sillon:sil,expediente:exp,comentario:'',nota:false,fotos:[],tags:await tagsHeredadas(exp,S.fecha),extras:{},creado:now(),updatedAt:now()};
  await put('entries',e);S.turno=tur;lsSet('turno',tur);
  if(!rapid){closeSheet();openEntry(e.id)}else{toast('Paciente agregado');render().catch(()=>{})}
  return 'added';
}

// Escala de grises + un poco de contraste: las hojas son texto, así pesan mucho menos y se leen igual.
function procGris(d,contraste=1.2,pivote=140){
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    g=(g-pivote)*contraste+pivote;
    g=g<0?0:g>255?255:g;
    d[i]=d[i+1]=d[i+2]=g;
  }
  return d;
}
function compress(file,modo){return new Promise((res,rej)=>{
  const ligera=modo!=='normal';
  const max=ligera?1280:1600,qual=ligera?.6:.72;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    try{
      const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      if(ligera){const id=ctx.getImageData(0,0,w,h);procGris(id.data);ctx.putImageData(id,0,0)}
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',qual);
    }catch(err){URL.revokeObjectURL(url);rej(err)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;});}

async function purge(){
  const lim=now()-DIAS_FOTO*DAY;const old=[];
  await new Promise((res,rej)=>{const r=store('photos').openCursor();r.onsuccess=()=>{const c=r.result;if(c){if((c.value.created||0)<lim)old.push(c.key);c.continue()}else res()};r.onerror=()=>rej(r.error)});
  if(!old.length)return 0;
  const gone=new Set(old);
  for(const k of old)await del('photos',k);
  for(const e of await all('entries')){
    const k=(e.fotos||[]).filter(i=>!gone.has(i));
    // las fotos son locales: limpiar la lista no cuenta como cambio para la sincronización
    if(k.length!==(e.fotos||[]).length){e.fotos=k;await put('entries',e,{nosync:true})}}
  return old.length;
}

    if(!cur||(r.updatedAt||0)>(cur.updatedAt||0)){await put('entries',{...r,fotos:cur&&cur.fotos?cur.fotos:(r.fotos||[])});b++}}
  if(Array.isArray(d.tags)){const m=await getTags();for(const g of d.tags)if(!m.includes(g))m.push(g);await setTags(m)}

function atajo(ev){
  if(!ev.altKey||ev.ctrlKey||ev.metaKey||ev.shiftKey)return false;
  const vis=sel=>{for(const x of sel.split(',')){const e=document.querySelector(x.trim());if(e&&!e.disabled&&(e.getClientRects().length||!document.body.getClientRects().length))return e}return null};
  const go=sel=>{const e=vis(sel);if(!e)return false;e.click();return true};
  const c=ev.code;let r=false;
  if(c==='KeyN')r=go('[data-st="nota"]');
  else if(c==='KeyP')r=go('[data-st="pase"]');
  else if(c==='KeyC')r=go('#nc-quick2,#nc-quick,#nc-copy');
  else if(c==='KeyV')r=go('#nc-open2,#nc-open');
  else if(c==='KeyH')r=go('#e-nota');
  else if(c==='KeyO'){const e=vis('#e-com');if(e){e.focus();r=true}}
  else if(c==='KeyL')r=go('#e-lres');
  else if(c==='KeyS')r=go('#e-lab');
  else if(c==='KeyR')r=go('#e-rx');
  else if(c==='KeyX')r=go('#e-ficha');
  else if(c==='Comma')r=go('#e-prev');
  else if(c==='Period')r=go('#e-next');
  else if(/^Digit[123]$/.test(c)&&S.view==='hoy')r=go('[data-t="'+c.slice(5)+'"]');
  else if(c==='KeyA'){openAtajos();r=true}
  if(r)ev.preventDefault();
  return r}
document.addEventListener('keydown',ev=>{
  const tg=ev.target,typing=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
  if(((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&(ev.key||'').toLowerCase()==='k')||(ev.key==='/'&&!typing&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey)){
    ev.preventDefault();focusSearch().catch(err=>logErr('atajo',err));return}
  if(ev.target&&ev.target.id==='s-q'){
    if(ev.key==='Escape'){sKeep=null;clearSearch();ev.target.blur();return}

  if(ev.key==='Escape'){
    if($('#vw').classList.contains('on')){$('#v-x').onclick();return}
    if(sheetEl){ev.preventDefault();closeSheet()}
    return;
  }
  if(ev.key==='Tab'&&sheetEl&&!sheetDocked){ // el Tab no se escapa de la hoja
    const fs=[...sheetEl.querySelectorAll('button:not([tabindex="-1"]),input:not([type=hidden]):not([hidden]),select,textarea,summary')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!fs.length)return;
    const first=fs[0],last=fs[fs.length-1],act=document.activeElement;
    if(!sheetEl.contains(act)){ev.preventDefault();first.focus()}
    else if(ev.shiftKey&&act===first){ev.preventDefault();last.focus()}
    else if(!ev.shiftKey&&act===last){ev.preventDefault();first.focus()}
  }
});

      const dest=L.find(x=>x.f===nf);if(dest&&!(await askUI('Ya hay resultados el '+labFec(nf)+'. ¿Combinarlos? Los valores de esta captura reemplazan a los repetidos.','Combinar','Cancelar')))return;

  });

/* ---------- Sincronización con Firebase (opcional) ----------
   Cada dispositivo sigue guardando todo local. Aquí solo se suben los cambios y se bajan los de los demás.
   Cada registro (paciente, pendiente, sesión, etiquetas) lleva updatedAt: gana el cambio más reciente.
   Las fotos NO se sincronizan (viven solo en el dispositivo donde se tomaron). */
const SYNC=(()=>{
  const st={uid:null,email:'',status:'init',pending:0,denied:0,last:0,err:'',syncNames:true,syncPhotos:true,remote:{},unsubs:[],chain:Promise.resolve(),first:{},forceNames:false,fs:null,auth:null};
  const DIAS_ENT=36500; // Historial completo: no limitar la sincronización a 45 días
  const cfgOk=()=>{try{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&c.projectId&&!/PEGA_AQUI/.test(JSON.stringify(c)))}catch(e){return false}};
  const typing=()=>{const a=document.activeElement;return !!(a&&/^(sy-|s-q$)/.test(a.id||''))};
  const changed=()=>{clearTimeout(changed.t);changed.t=setTimeout(()=>{try{if(S.view==='resp'&&!sheetEl&&!typing())render().catch(()=>{})}catch(e){}},200)};
  const ref=(coll,id)=>{const c=st.fs.collection('users').doc(st.uid).collection(coll);return id==null?c:c.doc(coll==='meta'?id:encodeURIComponent(id))};
  const enq=fn=>{st.chain=st.chain.then(fn).catch(e=>logErr('sync',e));return st.chain};
  const fail=(err,n=1)=>{if(err&&err.code==='permission-denied')st.denied+=n;else logErr('subir',err)};

  /* --- registros --- */
  const DELMIG=1795694400000; /* 26-nov-2026: obliga a subir una vez los expedientes que ya estaban eliminados */
  const recPat=p=>{if(p.deleted)return {expediente:p.expediente,deleted:true,updatedAt:Math.max(patStamp(p),DELMIG)};const r={expediente:p.expediente,deleted:false,acceso:p.acceso||'',aviso:p.aviso||'',sexo:p.sexo||'',updatedAt:patStamp(p)};if(p.dias)r.dias=p.dias;if(p.turnoHab)r.turnoHab=p.turnoHab;if(st.syncNames){r.nombre=p.nombre||'';if(p.plantilla!==undefined)r.plantilla=p.plantilla;if(p.ficha)r.ficha=fNorm(p.ficha);if(p.labs&&p.labs.length)r.labs=labsNorm(p.labs);if(p.labPlan&&Object.keys(p.labPlan).length)r.labPlan=p.labPlan}return r};
  const recPend=(p,x)=>({id:x.id,expediente:p.expediente,texto:x.texto,hecho:!!x.hecho,hechoEn:x.hechoEn||null,creado:x.creado||0,del:!!x.del,vence:x.vence||null,tipo:x.tipo||null,datos:x.datos||null,updatedAt:pStamp(x)});
  const recEnt=e=>{const r={...e};delete r.fotos;r.deleted=!!e.deleted;r.updatedAt=e.updatedAt||0;return r};
  // Fotos: ya vienen comprimidas (ligeras ~100-150 KB); van dentro del documento como texto base64.
  // Un documento de Firestore admite ~1 MB, por eso se descarta lo que pase de este límite.
  const MAX_FOTO=950000;
  async function recPhoto(ph){
    const data=await blobToData(ph.blob);
    if(data.length>MAX_FOTO)return null;
    return {id:ph.id,entry:ph.entry||'',expediente:ph.expediente||'',created:ph.created||0,deleted:false,data,updatedAt:ph.created||0};
  }
  function itemsFor(name,v){
    if(name==='patients'){const a=[['patients',v.expediente,recPat(v)]];for(const x of v.pendientes||[]){const r=recPend(v,x);if(v.deleted){r.del=true;r.texto='';r.datos=null;r.updatedAt=Math.max(r.updatedAt,DELMIG)}a.push(['pendientes',x.id,r])}return a}
    if(name==='entries')return [['entries',v.id,recEnt(v)]];
    if(name==='meta'&&v.k==='tags')return [['meta','tags',{v:v.v,updatedAt:v.updatedAt||0}]];
    return [];
  }
  const due=it=>{const k=it[0]+'~'+it[1],s=it[2].updatedAt;return st.remote[k]===undefined||s>st.remote[k]};

  /* --- subir --- */
  function write(it){
    st.remote[it[0]+'~'+it[1]]=it[2].updatedAt;st.pending++;
    return (it[0]==='patients'&&it[2].deleted?ref(it[0],it[1]).set(it[2]):ref(it[0],it[1]).set(it[2],{merge:true}))
      .then(()=>{st.last=now()})
      .catch(fail)
      .then(()=>{st.pending--;changed()});
  }
  function push(name,v){if(!st.uid||!st.fs)return;for(const it of itemsFor(name,v))if(due(it))write(it)}
  async function pushPhoto(ph){
    if(!st.uid||!st.fs||!st.syncPhotos||!ph)return;
    try{
      const rec=await recPhoto(ph);
      if(!rec){logErr('foto','Foto demasiado pesada para sincronizar');return 'pesada'}
      const it=['photos',ph.id,rec];if(due(it))write(it);
    }catch(e){logErr('foto',e)}
  }
  // borrar una foto = dejar una marca (sin imagen) para que los demás dispositivos también la quiten
  function dropPhoto(ph){
    if(!st.uid||!st.fs||!st.syncPhotos||!ph)return;
    write(['photos',ph.id,{id:ph.id,entry:ph.entry||'',expediente:ph.expediente||'',created:ph.created||0,deleted:true,data:'',updatedAt:now()}]);
  }
  // la nube solo conserva las fotos de los últimos 7 días, igual que los dispositivos
  async function purgeRemote(){
    crumb('sync limpia nube');
    if(!st.uid||!st.fs||!st.syncPhotos)return;
    try{
      const snap=await ref('photos').where('created','<',now()-DIAS_FOTO*DAY).get();
      snap.forEach(d=>{d.ref.delete().catch(fail)});
    }catch(e){logErr('limpiar nube',e)}
  }
  async function pushAll(){
    crumb('sync sube todo');
    if(!st.uid||!st.fs)return;
    const items=[];
    for(const p of await all('patients'))items.push(...itemsFor('patients',p));
    const cut=todayStr(new Date(Date.now()-DIAS_ENT*DAY));
    for(const e of await all('entries'))if((e.fecha||'')>=cut)items.push(...itemsFor('entries',e));
    const t=await get('meta','tags');
    if(t){if(!t.updatedAt){t.updatedAt=now();await put('meta',t,{nosync:true})}items.push(...itemsFor('meta',t))}
    items.filter(due).forEach(write);
    if(st.syncPhotos){ // fotos que ya estaban en este dispositivo y la nube todavía no tiene
      const lim=now()-DIAS_FOTO*DAY;
      for(const k of await rq(store('photos').getAllKeys())){
        if(st.remote['photos~'+k]!==undefined)continue;
        const ph=await get('photos',k);if(!ph||(ph.created||0)<lim)continue;
        await pushPhoto(ph);
      }
    }
  }

  /* --- bajar --- */
  async function applyRemote(name,r){
    crumb('sync aplica '+name);
    if(name==='patients'){
      const cur=await get('patients',r.expediente),rs=r.updatedAt||0;
      if(!st.forceNames&&cur&&patStamp(cur)>=rs)return null;
      const p=cur||{expediente:r.expediente,nombre:'',pendientes:[],updatedAt:0};
      if('deleted' in r)p.deleted=!!r.deleted;
      if(r.deleted){p.pu=rs;p.updatedAt=Math.max(p.updatedAt||0,rs);await put('patients',p,{nosync:true});return p}
      if(st.syncNames&&typeof r.nombre==='string')p.nombre=r.nombre;
      if(st.syncNames&&typeof r.plantilla==='string')p.plantilla=r.plantilla;if(st.syncNames&&r.ficha&&typeof r.ficha==='object')p.ficha=r.ficha;if(st.syncNames&&Array.isArray(r.labs))p.labs=r.labs;if(st.syncNames&&r.labPlan&&typeof r.labPlan==='object')p.labPlan=r.labPlan;
      if('acceso' in r)p.acceso=r.acceso;if('aviso' in r)p.aviso=r.aviso;if('sexo' in r)p.sexo=r.sexo;if('dias' in r)p.dias=r.dias;if('turnoHab' in r)p.turnoHab=r.turnoHab;
      p.pu=rs;p.updatedAt=Math.max(p.updatedAt||0,rs);
      await put('patients',p,{nosync:true});return p;
    }
    if(name==='pendientes'){
      let p=await get('patients',r.expediente);
      if(!p)p={expediente:r.expediente,nombre:'',pendientes:[],updatedAt:0,pu:0};
      const i=p.pendientes.findIndex(x=>x.id===r.id),rs=r.updatedAt||0;
      if(i>=0&&pStamp(p.pendientes[i])>=rs)return null;
      const item={id:r.id,texto:r.texto,hecho:!!r.hecho,hechoEn:r.hechoEn||null,creado:r.creado||0,updatedAt:rs,del:!!r.del,vence:r.vence||null,tipo:r.tipo||null,datos:r.datos||null};
      if(i>=0)p.pendientes[i]=item;else p.pendientes.push(item);
      p.updatedAt=Math.max(p.updatedAt||0,rs);
      await put('patients',p,{nosync:true});return p;
    }
    if(name==='entries'){
      const cur=await get('entries',r.id);
      if(cur&&(cur.updatedAt||0)>=(r.updatedAt||0))return null;
      // las fotos que ya llegaron antes que su sesión se enlazan aquí
      const ids=await photoIdsOf(r.id);
      const e={...r,fotos:[...new Set([...(cur&&cur.fotos||[]),...ids])]};
      await put('entries',e,{nosync:true});return e;
    }
    if(name==='photos'){
      const cur=await get('photos',r.id);
      if(r.deleted){
        if(cur)await del('photos',r.id);
        const e=await get('entries',r.entry);
        if(e&&(e.fotos||[]).includes(r.id)){e.fotos=e.fotos.filter(x=>x!==r.id);await put('entries',e,{nosync:true})}
        return cur?{photo:true,entry:r.entry}:null;
      }
      if(cur||!r.data||(r.created||0)<now()-DIAS_FOTO*DAY)return null;
      const blob=await (await fetch(r.data)).blob();
      await putRaw('photos',{id:r.id,blob,created:r.created,entry:r.entry,expediente:r.expediente});
      const e=await get('entries',r.entry);
      if(e){if(!e.fotos)e.fotos=[];if(!e.fotos.includes(r.id)){e.fotos.push(r.id);await put('entries',e,{nosync:true})}}
      return {photo:true,entry:r.entry};
    }
    if(name==='meta'&&r.v&&Array.isArray(r.v)){
      const cur=await get('meta','tags');
      if(cur&&(cur.updatedAt||0)>=(r.updatedAt||0))return null;
      await put('meta',{k:'tags',v:r.v,updatedAt:r.updatedAt||0},{nosync:true});return {tags:true};
    }
    return null;
  }
  function afterApply(name,res){
    try{
      if(live){
        if(name==='entries'&&res.id===live.e.id){if(res.deleted){live.e.deleted=true;closeSheet()}else live.setE(res)}
        if(name==='photos'&&res.entry===live.e.id)live.refreshFotos();
        if((name==='patients'||name==='pendientes')&&res.expediente===live.e.expediente)live.setPat(res);
      }
    }catch(e){logErr('sync',e)}
    clearTimeout(afterApply.t);
    afterApply.t=setTimeout(()=>{if(db&&!typing())render().catch(()=>{})},150);
  }
  function unlisten(){st.unsubs.forEach(u=>{try{u()}catch(e){}});st.unsubs=[]}
  function listen(){
    crumb('sync escucha');
    unlisten();st.first={};
    const cut=todayStr(new Date(Date.now()-DIAS_ENT*DAY));
    const defs=[['patients',ref('patients')],['pendientes',ref('pendientes')],['entries',ref('entries').where('fecha','>=',cut)],['meta',ref('meta')]];
    if(st.syncPhotos)defs.push(['photos',ref('photos').where('created','>=',now()-DIAS_FOTO*DAY)]);
    defs.forEach(([name,q])=>{
      st.unsubs.push(q.onSnapshot(snap=>{
        crumb('sync recibe '+name+' '+snap.docChanges().length);
        snap.docChanges().forEach(ch=>{
          if(ch.type==='removed')return;
          const d=ch.doc.data();
          const id=name==='patients'?d.expediente:name==='meta'?ch.doc.id:d.id;
          st.remote[name+'~'+id]=d.updatedAt||0;
          enq(async()=>{
            const res=await applyRemote(name,d);if(res)afterApply(name,res);
            // al reactivar los nombres: si la nube no tiene nombre de este paciente pero aquí sí, se publica
            if(name==='patients'&&st.forceNames&&st.syncNames&&!d.deleted&&typeof d.nombre!=='string'){
              const p=await get('patients',d.expediente);
              if(p&&p.nombre){p.pu=now();p.updatedAt=now();await put('patients',p)}
            }
          });
        });
        if(!st.first[name]){st.first[name]=true;if(defs.every(x=>st.first[x[0]])){enq(()=>pushAll());enq(()=>purgeRemote())}}
        st.last=st.last||now();changed();
      },err=>{st.err=(err&&err.code)||String(err);logErr('escuchar '+name,err);changed()}));
    });
  }

  /* --- sesión --- */
  const msgAuth=e=>{const c=(e&&e.code)||'';
    return /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'Correo o contraseña incorrectos'
      :/network/.test(c)?'Sin conexión a internet'
      :/too-many/.test(c)?'Demasiados intentos, espera unos minutos'
      :/unauthorized-domain/.test(c)?'Este dominio no está autorizado en Firebase'
      :(e&&e.message)||'No se pudo iniciar sesión'};
  function init(){
    crumb('sync inicia');
    if(!cfgOk()){st.status='nocfg';changed();return}
    if(typeof firebase==='undefined'){st.status='nosdk';changed();return}
    try{
      firebase.initializeApp(window.FIREBASE_CONFIG);
      st.auth=firebase.auth();st.fs=firebase.firestore();
      try{st.fs.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true})}catch(e){logErr('firestore',e)}
      // 11.65: sin caché offline de Firestore (la app ya guarda todo en su propia base y reenvía lo pendiente); evita bloqueos de IndexedDB en iOS
    }catch(e){logErr('firebase',e);st.status='error';st.err=String((e&&e.message)||e);changed();return}
    st.status='out';
    st.auth.onAuthStateChanged(async u=>{
      try{
        if(u){const m=await get('meta','syncnames');st.syncNames=!(m&&m.v===false);
          const m2=await get('meta','syncphotos2');st.syncPhotos=!!(m2&&m2.v===true);st.uid=u.uid;st.email=u.email||'';st.status='on';listen()}
        else{unlisten();st.uid=null;st.email='';st.status='out'}
      }catch(e){logErr('sesión',e)}
      changed();
    });
    changed();
  }
  async function login(email,pass){
    if(!st.auth)throw new Error('La sincronización no está disponible');
    try{await st.auth.signInWithEmailAndPassword(email,pass)}catch(e){throw new Error(msgAuth(e))}
  }
  const logout=()=>st.auth?st.auth.signOut():Promise.resolve();
  async function setNames(on){
    st.syncNames=!!on;await put('meta',{k:'syncnames',v:!!on},{nosync:true});
    if(st.uid){
      if(on){st.forceNames=true;setTimeout(()=>{st.forceNames=false},20000)} // al activar: se recuperan los nombres de la nube
      listen();
    }
    changed();
  }
  async function setPhotos(on){
    st.syncPhotos=!!on;await put('meta',{k:'syncphotos2',v:!!on},{nosync:true});
    if(st.uid)listen(); // al encender se bajan las fotos de la nube y se suben las que solo están aquí
    changed();
  }
  const syncNow=()=>{if(!st.uid)return Promise.resolve();listen();return enq(()=>pushAll())};
  return {_t:{itemsFor,applyRemote},push,pushPhoto,dropPhoto,init,login,logout,setNames,setPhotos,syncNow,state:()=>st};
})();

/* ---------- Inicio ---------- */
(async()=>{
  // Si la app se cerró durante el inicio anterior, arranca en modo seguro (sin sincronización ni limpieza) hasta que la reanudes.
  try{const pc=JSON.parse(lsGet('crumb')||'null');if(pc&&pc.s!=='segundo plano')logErr('cierre previo','Último evento antes de cerrarse: '+pc.s+' ('+new Date(pc.t).toLocaleTimeString('es-MX')+'). Si la cerraste tú, ignóralo.')}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')crumb('segundo plano')});window.addEventListener('pagehide',()=>crumb('segundo plano'));
  crumb('inicio');
  const bootOk=()=>lsSet('booting','0');
  if(lsGet('booting')==='1'){lsSet('safe','1');lsSet('safeWhy',lastCrumb);logErr('inicio','La app se cerró durante el inicio anterior (último paso: '+lastCrumb+'): modo seguro')}
  lsSet('booting','1');setTimeout(bootOk,8000);window.addEventListener('pagehide',bootOk);
  const safe=lsGet('safe')==='1';
  try{db=await openDB()}catch(e){logErr('abrir base',e);$('#main').innerHTML='<div class="empty">Este navegador no permite guardar datos locales (¿modo privado?).</div>';return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await render();
  if(!safe){
    purge().catch(e=>logErr('limpiar fotos',e));
    // la sincronización arranca cuando terminan de cargar los scripts de Firebase
    if(document.readyState==='complete')SYNC.init();else window.addEventListener('load',()=>SYNC.init());
    setInterval(()=>purge().catch(()=>{}),36e5);
  }
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible')return;
    if(!safe)await purge().catch(()=>{});
    if(S.hoy&&S.fecha!==todayStr())S.fecha=todayStr();
    if(!sheetEl)render();
  });
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
